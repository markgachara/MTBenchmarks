# Machine Translation Model Registry for Benchmarking
# v1.0: Lightweight + specialized models for English ↔ Gĩkũyũ

models:
  # Large-Scale Multilingual Models
  nllb_200:
    name: "NLLB-200 (600M Distilled)"
    model_id: "facebook/nllb-200-distilled-600M"
    model_type: "transformer_mt"
    parameters: 600000000
    download_size_gb: 2.48
    vram_fp32_gb: 2.4
    vram_fp16_gb: 1.2
    vram_int8_gb: 0.6
    dtype: "torch.float16"  # default quantization
    is_encoder_decoder: true
    batch_size: 8
    max_new_tokens: 256
    num_beams: 5
    device_map: "auto"
    description: "Distilled multilingual encoder-decoder (200 languages)"

  m2m_100:
    name: "M2M-100 (418M)"
    model_id: "facebook/m2m100_418M"
    model_type: "transformer_mt"
    parameters: 418000000
    download_size_gb: 1.7
    vram_fp32_gb: 1.6
    vram_fp16_gb: 0.8
    vram_int8_gb: 0.45
    dtype: "torch.float16"
    is_encoder_decoder: true
    batch_size: 8
    max_new_tokens: 256
    num_beams: 5
    device_map: "auto"
    description: "Dense multilingual encoder-decoder (100 languages)"

  seamless_m4t:
    name: "SeamlessM4T (Medium)"
    model_id: "facebook/seamless-m4t-medium"
    model_type: "transformer_mt"
    parameters: 1200000000
    download_size_gb: 4.0
    vram_fp32_gb: 3.0
    vram_fp16_gb: 1.5
    vram_int8_gb: 0.8
    dtype: "torch.float16"
    is_encoder_decoder: true
    batch_size: 4  # smaller batch for medium model
    max_new_tokens: 256
    num_beams: 5
    device_map: "auto"
    description: "Multimodal multilingual encoder-decoder (96 languages)"
    lang_format: "seamless"  # special lang code format

  # Community Fine-Tuned Model
  kikuyu_translator:
    name: "Kikuyu Translator (LoRA Fine-tuned Gemma-3)"
    model_id: "InterstellarCG/kikuyu-translator-final"
    model_type: "lora_finetuned"
    parameters: 4000000000
    download_size_gb: 8.0
    vram_fp32_gb: 10.0
    vram_fp16_gb: 6.0
    vram_int8_gb: 4.0
    dtype: "torch.float16"
    is_encoder_decoder: false  # Decoder-only LLM with LoRA
    batch_size: 4
    max_new_tokens: 256
    device_map: "auto"
    description: "LoRA fine-tuned model for bidirectional English-Kikuyu translation"
    bidirectional: true
    special_handling: "lora_gemma"

  # General-Purpose LLMs via Prompting
  mistral_7b:
    name: "Mistral-7B-Instruct-v0.3"
    model_id: "mistralai/Mistral-7B-Instruct-v0.3"
    model_type: "llm_prompting"
    parameters: 7000000000
    download_size_gb: 14.0
    vram_fp32_gb: 16.0
    vram_fp16_gb: 8.0
    vram_int8_gb: 4.0
    dtype: "torch.float16"
    is_encoder_decoder: false
    batch_size: 4
    max_new_tokens: 256
    temperature: 0.3
    top_p: 0.9
    device_map: "auto"
    description: "Instruction-tuned LLM for zero-shot MT via prompting"
    prompting_mode: "zero_shot"

  mistral_small:
    name: "Mistral-Small-3.1-24B"
    model_id: "mistralai/Mistral-Small-3.1-24B-Instruct-2411"
    model_type: "llm_prompting"
    parameters: 24000000000
    download_size_gb: 50.0
    vram_fp32_gb: 56.0
    vram_fp16_gb: 28.0
    vram_int8_gb: 14.0
    dtype: "torch.float16"
    is_encoder_decoder: false
    batch_size: 1  # Small batch due to size
    max_new_tokens: 256
    temperature: 0.3
    top_p: 0.9
    device_map: "auto"
    description: "Large instruction-tuned LLM for few-shot MT via prompting"
    prompting_mode: "few_shot"
    skip_on_low_memory: true  # Optional: skip if insufficient VRAM

# Language code mappings
language_codes:
  english: "eng"
  kikuyu: "kik"
  english_flores: "eng_Latn"
  kikuyu_flores: "kik_Latn"
  english_seamless: "eng"
  kikuyu_seamless: "kik"
  english_iso639_3: "eng"
  kikuyu_iso639_3: "kik"
