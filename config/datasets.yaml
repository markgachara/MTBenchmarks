# Dataset Registry for MT Benchmarking
# Aligned with paper: GAC 500-pair test set as PRIMARY evaluation dataset

datasets:
  # PRIMARY evaluation dataset
  gac_test:
    name: "Gĩkũyũ Agricultural Corpus (GAC) Test Set"
    type: "local_excel"
    path: "data/selectpairs500.xlsx"
    size: 500
    source_lang: "eng"
    target_lang: "kik"
    columns:
      english: "translatedText"
      kikuyu: "data_to_quality_check"
      dialect: "sentenceDialect"
      id: "z"
    description: >
      500 human-validated parallel sentence pairs from the GAC.
      Agricultural domain, non-religious, non-FLORES.
      Excludes FLORES-200 sentences to avoid data leakage.
      Predominantly KI-MURANGA dialect (477/500).
    license: "Available upon request (Irura, 2025)"
    domain: "agricultural"
    notes: >
      This is the FINAL 500-pair test set from Mark's email (11 Apr 2026).
      Superseded by gac_july_v1_1 (see below) for the fine-tuning phase.

  # CORRECTED July 2026 release — used for fine-tuning + post-FT evaluation
  gac_july_v1_1:
    name: "GAC Corrected Release v1.1 (July 2026)"
    type: "local_excel_splits"
    base_path: "data/JulyDataUpdate"
    columns:
      english: "English"
      kikuyu: "Gikuyu"
      dialect: "dialect"
    splits:
      train:
        path: "data/JulyDataUpdate/TRAIN_DATA.xlsx"
        rows: 1847
        usable: 1836   # after dropping 11 exact duplicate pairs
      validation:
        path: "data/JulyDataUpdate/VALIDATION_DATA.xlsx"
        rows: 49
        usable: 49
      test:
        path: "data/JulyDataUpdate/TEST_DATA.xlsx"
        rows: 451
        usable: 450    # one row has a null English side
      full:
        path: "data/JulyDataUpdate/FULL_GAC_scripted_v1.1.xlsx"
        rows: 2311
    description: >
      Corrected GAC release with a revised column schema (English/Gikuyu).
      Verified zero leakage across train/validation/test. The train split is
      fully disjoint from the original selectpairs500 benchmark set, so
      fine-tuning on it does not contaminate the baseline comparison.
    notes: >
      test (451) + validation (49) together reconstitute the original
      selectpairs500 set, so validation is in-domain with test.
      Known issues: inconsistent dialect labels
      (GĨ-KABETE_(KIAMBU) / GĨKABETE_(KIAMBU) / GĨ-KABETE(KIAMBU));
      FULL contains 2300 unique pairs vs 2336 in the union of the splits.

  # OPTIONAL validation datasets (not primary)
  flores_200:
    name: "FLORES-200"
    type: "huggingface"
    dataset_id: "facebook/flores"
    config: "kik_Latn-eng_Latn"
    splits:
      devtest:
        hf_split: "devtest"
        size: 1012
    source_lang: "kik_Latn"
    target_lang: "eng_Latn"
    text_field: "sentence"
    description: "Professional multilingual benchmark. NOT used as primary eval (risk of data leakage for NLLB/M2M)."
    evaluate: false  # Excluded from primary benchmark per paper

# Evaluation configuration
evaluation:
  primary_dataset: "gac_test"

  directions:
    - source_lang: "eng"
      target_lang: "kik"
      description: "English to Gĩkũyũ"
    - source_lang: "kik"
      target_lang: "eng"
      description: "Gĩkũyũ to English"

  # Metric suite per paper Section 3.4
  metrics:
    # MT-specific quantitative metrics
    mt_specific:
      - name: "bleu"
        library: "sacrebleu"
        role: "secondary"
        notes: "Standardized tokenization. Retained for comparability with broader MT literature."
      - name: "chrf++"
        library: "sacrebleu"
        role: "primary_surface"
        params:
          char_order: 6
          word_order: 2
        notes: "Primary surface-level metric for morphologically agglutinative Gĩkũyũ."
      - name: "bertscore"
        library: "bert-score"
        role: "secondary"
        model: "bert-base-multilingual-cased"
        notes: "Semantic similarity via contextual embeddings."
      - name: "africomet_mtl"
        library: "unbabel-comet"
        checkpoint: "masakhane/africomet-mtl"
        role: "primary_ranking"
        notes: >
          PRIMARY RANKING METRIC. Trained on human evaluation data
          including English-Kikuyu. Spearman correlation 0.441 with human
          judgments on AfriMTE test set.

    # Corpus-level linguistic metrics
    corpus_level:
      - name: "perplexity"
        notes: "Score generated Gĩkũyũ text against a language model."
      - name: "type_token_ratio"
        notes: "Lexical diversity. Compare model output vs human reference."
      - name: "hapax_legomena_rate"
        notes: "Words appearing exactly once / total unique words."
      - name: "avg_sentence_length"
        notes: "Mean word count + std dev per direction."

  # Qualitative assessment parameters
  qualitative:
    sample_size: 50  # Stratified sample from 500-pair test set
    criteria:
      - "diacritic_accuracy"
      - "idiomatic_appropriateness"
      - "biblical_register_avoidance"
      - "cultural_concept_handling"
      - "addition"
      - "omission"
      - "mistranslation"
      - "grammar"
    scale: "1-5"  # 5 = human-reference quality
    assessors: 2  # Two fluent Gĩkũyũ speakers

# Caching
data_cache:
  cache_dir: "./data/cache"
