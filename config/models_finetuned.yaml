    vram_fp16_gb: 6.6
    dtype: "torch.float16"
    is_encoder_decoder: true
    batch_size: 2
    max_new_tokens: 256
    num_beams: 5
    device_map: "auto"
    lang_code_format: "flores"
    directions: ["kik->eng"]
    description: "QLoRA fine-tune (4-bit NF4, r=16) of facebook/nllb-200-3.3B on GAC v1.1 train split."
    merge_adapter: false   # 3.3B fp16 merge spikes to ~13 GB; run adapter directly to fit 11 GB
